<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,400&family=Inter:wght@300;400;600&display=swap" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: #0e0a07;
      }

      [data-composition-id="main"] {
        width: 1080px;
        height: 1920px;
        position: relative;
        overflow: hidden;
        background: #0e0a07;
        font-family: 'Inter', sans-serif;
      }

      /* â”€â”€ Foto del plato a pantalla completa â”€â”€ */
      .dish-photo {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        object-position: center 40%;
        transform-origin: center center;
        will-change: transform;
      }

      /* â”€â”€ Gradiente oscuro sobre la foto â”€â”€ */
      .overlay {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(
            to bottom,
            rgba(14,10,7,0.18) 0%,
            rgba(14,10,7,0.05) 22%,
            rgba(14,10,7,0.40) 50%,
            rgba(14,10,7,0.84) 68%,
            rgba(14,10,7,0.97) 82%,
            #0e0a07 100%
          );
      }

      /* â”€â”€ LÃ­nea naranja top â”€â”€ */
      .top-line {
        position: absolute;
        top: 0; left: 0; right: 0;
        height: 4px;
        background: linear-gradient(90deg, transparent 0%, #e5472a 50%, transparent 100%);
        transform-origin: left center;
      }

      /* â”€â”€ Pill "Hoy recomendamos" (parte superior) â”€â”€ */
      .pill-hoy {
        position: absolute;
        top: 90px;
        left: 50%;
        transform: translateX(-50%);
        display: inline-flex;
        align-items: center;
        gap: 18px;
        padding: 18px 44px;
        border-radius: 100px;
        border: 1.5px solid rgba(229,71,42,0.45);
        background: rgba(14,10,7,0.55);
        backdrop-filter: blur(12px);
        white-space: nowrap;
      }
      .pill-dot {
        width: 12px;
        height: 12px;
        border-radius: 50%;
        background: #e5472a;
        flex-shrink: 0;
      }
      .pill-text {
        font-size: 30px;
        font-weight: 600;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #fff;
      }

      /* â”€â”€ Contenido en la parte inferior â”€â”€ */
      .content-area {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        padding: 0 80px 120px;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
      }

      .cat-label {
        font-size: 24px;
        font-weight: 400;
        letter-spacing: 0.30em;
        text-transform: uppercase;
        color: #e5472a;
        margin-bottom: 28px;
      }

      .dish-name {
        font-family: 'Playfair Display', serif;
        font-size: 88px;
        font-weight: 700;
        line-height: 1.07;
        color: #fff;
        max-width: 920px;
        text-shadow: 0 2px 32px rgba(0,0,0,0.5);
      }
      .dish-name em {
        font-style: italic;
        font-weight: 400;
        color: rgba(255,255,255,0.75);
      }

      .sep {
        width: 60px;
        height: 2px;
        background: #e5472a;
        margin: 52px 0 44px;
        border-radius: 2px;
        transform-origin: left center;
      }

      .dish-desc {
        font-size: 32px;
        font-weight: 300;
        color: rgba(255,255,255,0.55);
        letter-spacing: 0.03em;
        line-height: 1.55;
        max-width: 760px;
        margin-bottom: 52px;
      }

      .price-row {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .price-num {
        font-family: 'Playfair Display', serif;
        font-size: 110px;
        font-weight: 700;
        line-height: 1;
        color: #e5472a;
      }
      .price-sym {
        font-size: 52px;
        font-weight: 300;
        color: rgba(229,71,42,0.7);
        font-family: 'Inter', sans-serif;
      }

      /* â”€â”€ Fade final â”€â”€ */
      .fade-out {
        position: absolute;
        inset: 0;
        background: #0e0a07;
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
